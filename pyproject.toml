[project]
name = "model-processing-engine"
version = "0.1.0"
description = "Business-neutral runtime for externally defined model tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "pydantic>=2.8,<3",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.3,<3",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
mpe = "model_processing_engine.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_processing_engine = ["default_providers.json", "admin_ui/*"]

[tool.ruff]
line-length = 100
